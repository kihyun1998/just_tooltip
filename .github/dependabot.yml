# Pub constraint updates for the package root and example/, and the workflows' actions.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    labels:
      - needs-triage
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: monthly
    groups:
      example:
        patterns: ["*"]
    ignore:
      # Major cupertino_icons updates wait for the CI Flutter pin.
      - dependency-name: cupertino_icons
        update-types: ["version-update:semver-major"]
    labels:
      - needs-triage
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels:
      - needs-triage
