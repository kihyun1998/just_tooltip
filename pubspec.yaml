name: just_tooltip
description: "A lightweight, customizable Flutter tooltip with flexible placement, hover & tap triggers, programmatic control, and RTL support."
version: 0.4.2
homepage: https://github.com/kihyun1998/just_tooltip
repository: https://github.com/kihyun1998/just_tooltip
issue_tracker: https://github.com/kihyun1998/just_tooltip/issues
topics:
  - tooltip
  - overlay
  - popup
  - widget
  - ui

environment:
  # `RenderObject.parent` became `RenderObject?` in Flutter 3.13 (it was
  # `AbstractNode?`, which has no describeApproximatePaintClip). The ancestor
  # clip walk in JustTooltip needs the newer type. Flutter 3.13 ships Dart 3.1.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

flutter:
